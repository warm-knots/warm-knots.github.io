<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Owner panel | Warm Knots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:18px;font-family:system-ui,sans-serif}
.card h2{margin:0 0 12px;font:600 18px Georgia,serif}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=number],select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
textarea{min-height:90px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px;color:var(--fg)}.chk input{width:18px;height:18px;accent-color:var(--acc)}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.tabs{display:flex;margin-bottom:18px}.tabs button{flex:1;border:1px solid var(--bd);background:#fff;color:var(--fg);padding:10px 0;font:600 15px system-ui,sans-serif;cursor:pointer}
.tabs button:first-child{border-radius:10px 0 0 10px}.tabs button:last-child{border-radius:0 10px 10px 0}.tabs button:not(:first-child){border-left:0}.tabs .on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pr{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd);touch-action:none;user-select:none;-webkit-user-select:none}
.pr:first-of-type{border-top:0}
.pr.dragging{opacity:.45;background:#fff3ee}
.pr.drag-over{border-top:2px solid var(--acc)}
.pr img,.pr .ph{width:56px;height:70px;object-fit:contain;border-radius:8px;border:1px solid var(--bd);flex:none;background:#f3ebdf}
.pr .t{flex:1;min-width:0}.pr .t b{display:block;font:600 15px Georgia,serif}.pr .t span{font-size:12px;color:var(--mut)}
.handle{flex:none;width:28px;height:40px;display:flex;align-items:center;justify-content:center;cursor:grab;color:var(--mut);touch-action:none}
.handle:active{cursor:grabbing}
.handle svg{pointer-events:none}
.sm{padding:6px 14px;font-size:13px}.dng{border-color:#b3261e;color:#b3261e}
.center{max-width:420px;margin:40px auto;text-align:center}
.grp{border:1px dashed var(--bd);border-radius:12px;padding:12px;margin-top:12px;background:var(--bg)}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pc{width:30px;height:30px;border-radius:50%;border:1px solid #cdbfae;padding:0;cursor:pointer}.pc.on{outline:3px solid var(--acc);outline-offset:1px}
.cust{display:flex;gap:8px;align-items:center;margin-top:8px}.cust input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.slot{border:2px dashed #cdbfae;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font:12px system-ui,sans-serif;cursor:pointer;overflow:hidden;background:#fff;padding:4px;box-sizing:border-box}
.slot.act{border-color:var(--acc);background:#fff3ee;color:var(--acc)}.slot img{width:100%;height:100%;object-fit:contain;display:block;margin:-4px}
.slot.big{width:140px;aspect-ratio:4/5}.slot.sm2{width:100%;aspect-ratio:4/5}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:10px}
.cc{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px}
.cc .nm2{display:flex;align-items:center;gap:6px;margin-top:6px}.cc .nm2 i{width:16px;height:16px;border-radius:50%;border:1px solid #cdbfae;flex:none}
.cc .nm2 input{width:100%;min-width:0;border:0;border-bottom:1px solid var(--bd);background:transparent;font:13px system-ui,sans-serif;padding:2px;color:var(--fg)}
.cc .row2{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.cc .row2 button{background:none;border:1px solid var(--bd);border-radius:6px;font:11px system-ui,sans-serif;padding:3px 6px;cursor:pointer;color:var(--fg)}
/* collapsible category groups */
.cg{border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.cg-h{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;background:#faf6f0}
.cg-h:hover{background:#f5eee6}
.cg-h .arrow{flex:none;width:18px;height:18px;transition:transform .2s;color:var(--mut)}
.cg.open .cg-h .arrow{transform:rotate(90deg)}
.cg-h b{flex:1;font:600 15px Georgia,serif}
.cg-h .cnt{font:13px system-ui,sans-serif;color:var(--mut)}
.cg-body{display:none;padding:0 10px 6px}
.cg.open .cg-body{display:block}
.cg-body .pr:first-child{border-top:0}
.stkrow{display:flex;align-items:center;gap:8px;margin-top:8px;font:12px system-ui,sans-serif;color:var(--mut)}
.stk{width:100%;min-width:0;box-sizing:border-box;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
.cc .row2 button.pick{flex:1 1 100%;background:var(--acc);color:#fff;border-color:var(--acc);padding:9px 6px;font-size:13px;font-weight:600}
.sec{font:600 16px Georgia,serif;margin:24px 0 4px}
</style></head>
<body><div id="root"></div>
<script type="module">
import {getLoadError,onUser,signIn,signOutUser,isAdmin,loadProducts,loadCategories,saveProduct,deleteProduct,saveCategory,deleteCategory,isSeeded,seedAll,resizeImage,loadColorPhotos,saveColorPhoto,deleteColorPhoto,deleteAllColorPhotos,newId,esc,peso,toast,BACK,PALETTE,loadLogo,saveLogo,LOGO,readyStock,loadOrders,saveOrder,deleteOrder,allColors,colorGroups} from './app.js';
let user=null,cats=[],list=[],tab='products',pf=null,cf=null,loading=true,act={t:'p',gi:0,ci:0},siteLogo='',orders=[],ordersErr='';
// which category groups are expanded (persists across re-renders in this session)
let openGroups=new Set();
const $=id=>document.getElementById(id),root=$('root');
const newPF=()=>({id:'',name:'',category:cats[0]?cats[0].id:'',price:'',description:'',stock:'',useReady:false,readyG:{label:'Color',colors:[]},image:'',useColors:false,groups:[{label:'Color',colors:[]}],createdAt:0,designer:false,photos:{},dirty:{},orig:[]});
const newCF=()=>({id:'',name:'',image:'',createdAt:0});
const same=(a,b)=>a.h.toLowerCase()===b.h.toLowerCase();
const groupAt=gi=>gi<0?pf.readyG:pf.groups[gi]; // gi -1 = the ready-made colors of the tote
// any product in the Bags category gets the ready-made + Customize setup
const bagCat=id=>{const c=cats.find(x=>x.id===id);return !!c&&(c.id==='bags'||/\bbags?\b/i.test(c.name||''))};
const isDes=()=>!!pf.designer||bagCat(pf.category);
const ensureDes=()=>{if(!isDes()||pf.groups.length>=2)return;
 if(pf.groups.length===1&&pf.groups[0].label==='Color'&&!pf.groups[0].colors.length)pf.groups[0].label='Outside';
 while(pf.groups.length<2)pf.groups.push({label:['Outside','Inside'][pf.groups.length],colors:[]})};
const COARSE=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const PHL=COARSE?'Tap to choose a photo':'Click, then Ctrl+V to paste';
const HANDLE=`<span class="handle" aria-label="Drag to reorder"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect y="2" width="14" height="2" rx="1"/><rect y="6" width="14" height="2" rx="1"/><rect y="10" width="14" height="2" rx="1"/></svg></span>`;
window.out=()=>signOutUser().then(()=>render());
window.login=async()=>{try{await signIn()}catch(e){const c=e.code||'';if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request')toast('Sign-in failed. Please try again.')}};
async function refresh(){
 try{if(!(await isSeeded()))await seedAll()}catch(e){toast('Could not set up your shop data: '+(e.code||e.message))}
 cats=await loadCategories();list=await loadProducts();siteLogo=await loadLogo();try{orders=await loadOrders();ordersErr=''}catch(e){orders=[];ordersErr=e.code||e.message||'error'}
 if(getLoadError())toast('Could not load everything: '+getLoadError());
 if(!pf)pf=newPF();if(!cf)cf=newCF();loading=false;
}
onUser(async u=>{user=u;if(isAdmin(u))await refresh();render()});
// keep what is typed before redrawing the page
function sync(){
 if(tab==='products'&&pf&&$('f_n')){pf.name=$('f_n').value;pf.category=$('f_c').value;pf.price=$('f_p').value;pf.description=$('f_d').value;if($('f_st'))pf.stock=$('f_st').value;if($('f_u'))pf.useColors=$('f_u').checked;if($('f_ur'))pf.useReady=$('f_ur').checked;pf.groups.forEach((g,i)=>{const e=$('gl'+i);if(e)g.label=e.value})}
 if(tab==='cats'&&cf&&$('c_n'))cf.name=$('c_n').value;
}
window.setTab=t=>{sync();tab=t;act={t:tab==='cats'?'c':tab==='site'?'logo':'p',gi:0,ci:0};render()};
// ---- photos: paste, drop, or upload into the selected box ----
const keyOf=a=>a.t+'|'+a.gi+'|'+a.ci;
window.actv=(t,gi,ci)=>{act={t,gi,ci};document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('act',s.dataset.k===keyOf(act)));
 if(COARSE){const id=t==='color'?'kf'+gi+'_'+ci:t==='p'?'pf_file':t==='c'?'cf_file':t==='logo'?'logo_file':'',el=id&&document.getElementById(id);if(el)el.click()}};
async function putPhoto(file){
 sync();let t=act.t;if(tab==='cats')t='c';else if(tab==='site')t='logo';else if(t==='c')t='p';
 try{
  if(t==='logo'){siteLogo=await resizeImage(file,400,.85);render();toast('Logo updated (not saved yet)');return}
  if(t==='color'){const c=groupAt(act.gi)&&groupAt(act.gi).colors[act.ci];
   if(c){pf.photos[c.id]=await resizeImage(file,700,.7);pf.dirty[c.id]=1;render();toast('Photo added to '+c.n);return}t='p'}
  if(t==='c'){cf.image=await resizeImage(file,700);render();toast('Picture added');return}
  pf.image=await resizeImage(file,800);render();toast('Photo added');
 }catch(e){toast('Could not use that image. Try a different one.')}
}
window.onFile=async(inp,t,gi,ci)=>{act={t,gi:gi||0,ci:ci||0};const f=inp.files[0];if(f)await putPhoto(f)};
window.dropP=async(e,t,gi,ci)=>{e.preventDefault();act={t,gi,ci};const f=[...(e.dataTransfer?e.dataTransfer.files:[])].find(x=>x.type.startsWith('image/'));if(f)await putPhoto(f)};
document.addEventListener('paste',async e=>{
 if(!isAdmin(user))return;
 const it=[...(e.clipboardData?e.clipboardData.items:[])].find(i=>i.kind==='file'&&i.type.startsWith('image/'));
 if(!it)return;e.preventDefault();await putPhoto(it.getAsFile());
});
window.rmPhoto=(gi,ci)=>{sync();const c=groupAt(gi).colors[ci];delete pf.photos[c.id];pf.dirty[c.id]=1;render()};
// ---- products ----
window.editP=async id=>{const p=list.find(x=>x.id===id);const gs=(p.options&&p.options.length)?JSON.parse(JSON.stringify(p.options)):[{label:'Color',colors:[]}];
 if(p.designer||bagCat(p.category))while(gs.length<2)gs.push({label:['Outside','Inside'][gs.length],colors:[]});
 const rg={label:'Color',colors:JSON.parse(JSON.stringify(p.readyColors||[]))};
 const fix=c=>{if(!c.id)c.id=newId();if(typeof c.stock!=='number')c.stock=''};
 gs.forEach(g=>g.colors.forEach(fix));rg.colors.forEach(fix);
 pf={id:p.id,name:p.name||'',category:p.category||'',price:p.price||'',description:p.description||'',stock:typeof p.stock==='number'?p.stock:(p.soldOut?0:''),useReady:rg.colors.length>0,readyG:rg,image:p.image||'',useColors:gs.some(g=>g.colors.length),groups:gs,createdAt:p.createdAt||0,designer:!!p.designer,photos:{},dirty:{},orig:[],position:p.position};
 pf.orig=[...gs.flatMap(g=>g.colors.map(c=>c.id)),...rg.colors.map(c=>c.id)];
 tab='products';act={t:'p',gi:0,ci:0};render();window.scrollTo(0,0);
 try{pf.photos=await loadColorPhotos(id);render()}catch(e){}};
window.cancelP=()=>{pf=newPF();render()};
window.delP=async id=>{sync();const p=list.find(x=>x.id===id);if(!confirm('Delete "'+p.name+'"? This cannot be undone.'))return;
 try{await deleteProduct(id);try{await deleteAllColorPhotos(id)}catch(e){}toast('Deleted');list=await loadProducts();if(pf.id===id)pf=newPF();render()}catch(e){toast('Could not delete: '+(e.code||e.message))}};
window.togColor=(gi,pi)=>{sync();const g=groupAt(gi),c=PALETTE[pi],k=g.colors.findIndex(x=>same(x,c));
 if(k>=0){const r=g.colors.splice(k,1)[0];if(pf.photos[r.id]){delete pf.photos[r.id];pf.dirty[r.id]=1}}else g.colors.push({id:newId(),n:c.n,h:c.h,stock:''});render()};
window.addCustom=gi=>{sync();const n=$('cn'+gi).value.trim()||'Custom',h=$('ch'+gi).value;const g=groupAt(gi);if(!g.colors.some(x=>same(x,{h})))g.colors.push({id:newId(),n,h,stock:''});render()};
window.rmColor=(gi,ci)=>{sync();const r=groupAt(gi).colors.splice(ci,1)[0];if(pf.photos[r.id]){delete pf.photos[r.id];pf.dirty[r.id]=1}render()};
window.nameColor=(gi,ci,v)=>{groupAt(gi).colors[ci].n=v.trim()||'Color'};
window.setStock=(gi,ci,v)=>{const n=Math.floor(Number(v));groupAt(gi).colors[ci].stock=(v===''||isNaN(n))?'':Math.max(0,n)};
window.addGroup=()=>{sync();pf.groups.push({label:'',colors:[]});render()};
window.rmGroup=gi=>{sync();pf.groups[gi].colors.forEach(c=>{if(pf.photos[c.id]){delete pf.photos[c.id];pf.dirty[c.id]=1}});pf.groups.splice(gi,1);if(!pf.groups.length)pf.groups=[{label:'Color',colors:[]}];render()};
window.presetBag=()=>{sync();pf.groups=[{label:'Outside',colors:[]},{label:'Inside',colors:[]}];pf.useColors=true;render()};
window.saveP=async()=>{
 sync();const name=pf.name.trim();
 if(!name)return toast('Please enter a product name');
 if(!pf.image)return toast('Please add a photo');
 if(!pf.category)return toast('Please choose a category (add one in the Categories tab first)');
 const bad=v=>v===''||v==null||isNaN(Number(v))||Number(v)<0,num=v=>Math.floor(Number(v)),norm=cs=>cs.map(c=>({...c,stock:num(c.stock)}));
 let options=[],readyColors=[],stock=0;
 if(isDes()){
  options=pf.groups.map(g=>({label:(g.label||'').trim()||'Color',colors:g.colors.map(({id,n,h})=>({id,n,h}))}));
  if(pf.useReady&&pf.readyG.colors.length){
   if(pf.readyG.colors.some(c=>bad(c.stock)))return toast('Please enter the stock for each ready-made color (0 if none)');
   readyColors=norm(pf.readyG.colors);stock=readyColors.reduce((s,c)=>s+c.stock,0);
  }else{if(bad(pf.stock))return toast('Please enter the stock (0 if none)');stock=num(pf.stock)}
 }else{
  const gs=pf.useColors?pf.groups.filter(g=>g.colors.length):[];
  if(gs.length){
   if(gs.some(g=>g.colors.some(c=>bad(c.stock))))return toast('Please enter the stock for each color (0 if none)');
   options=gs.map(g=>({label:(g.label||'').trim()||'Color',colors:norm(g.colors)}));
   stock=Math.min(...options.map(g=>g.colors.reduce((s,c)=>s+c.stock,0)));
  }else{if(bad(pf.stock))return toast('Please enter the stock (0 if none)');stock=num(pf.stock)}
 }
 const isNew=!pf.id;
 // new products go to the top of their category
 let position=pf.position;
 if(isNew){
  const sibs=list.filter(x=>x.category===pf.category);
  const minP=sibs.reduce((m,x)=>Math.min(m,x.position!=null?x.position:Infinity),0);
  position=minP-1;
 }
 const p={id:pf.id||'p'+Date.now(),name,category:pf.category,price:Number(pf.price)||0,description:pf.description.trim(),image:pf.image,stock,soldOut:stock<=0,options,createdAt:pf.createdAt||Date.now(),position};
 if(isDes()){p.designer=true;p.readyColors=readyColors}
 $('sv').disabled=true;
 try{
  await saveProduct(p);
  const cur=new Set([...options.flatMap(g=>g.colors.map(c=>c.id)),...readyColors.map(c=>c.id)]);
  for(const cid of Object.keys(pf.dirty)){if(cur.has(cid)){if(pf.photos[cid])await saveColorPhoto(p.id,cid,pf.photos[cid]);else await deleteColorPhoto(p.id,cid)}}
  for(const cid of pf.orig){if(!cur.has(cid))await deleteColorPhoto(p.id,cid)}
  toast('Saved!');list=await loadProducts();pf=newPF();act={t:'p',gi:0,ci:0};render();window.scrollTo(0,0)}
 catch(e){toast('Could not save: '+(e.code||e.message));$('sv').disabled=false}
};
// ---- categories ----
window.editC=id=>{const c=cats.find(x=>x.id===id);cf={id:c.id,name:c.name||'',image:c.image||'',createdAt:c.createdAt||0,position:c.position};tab='cats';act={t:'c',gi:0,ci:0};render();window.scrollTo(0,0)};
window.cancelC=()=>{cf=newCF();render()};
window.delC=async id=>{sync();const c=cats.find(x=>x.id===id),n=list.filter(p=>p.category===id).length;
 if(!confirm('Delete the category "'+c.name+'"?'+(n?'\n\n'+n+' product(s) in it will be hidden from the shop until you move them to another category.':'')))return;
 try{await deleteCategory(id);toast('Deleted');cats=await loadCategories();if(cf.id===id)cf=newCF();render()}catch(e){toast('Could not delete: '+(e.code||e.message))}};
window.saveC=async()=>{
 sync();const name=cf.name.trim();if(!name)return toast('Please enter a category name');
 const isNew=!cf.id;
 let position=cf.position;
 if(isNew){
  const maxP=cats.reduce((m,x)=>Math.max(m,x.position!=null?x.position:x.createdAt||0),0);
  position=maxP+1; // new categories at the end
 }
 const c={id:cf.id||'c'+Date.now(),name,image:cf.image||'',createdAt:cf.createdAt||Date.now(),position};
 $('cv').disabled=true;
 try{await saveCategory(c);toast('Saved!');cats=await loadCategories();cf=newCF();render();window.scrollTo(0,0)}
 catch(e){toast('Could not save: '+(e.code||e.message));$('cv').disabled=false}
};
// ---- collapsible groups ----
window.toggleGroup=id=>{
 if(openGroups.has(id))openGroups.delete(id);else openGroups.add(id);
 // just toggle class without full re-render to keep scroll position
 const el=document.querySelector('.cg[data-gid="'+id+'"]');
 if(el)el.classList.toggle('open',openGroups.has(id));
};
// ---- drag to reorder (pointer events – works immediately on touch & mouse) ----
let drag={active:false,type:null,group:null,id:null,el:null,startY:0,lastY:0};
function getListEls(type,group){
 if(type==='cat')return [...document.querySelectorAll('.pr[data-dtype="cat"]')];
 return [...document.querySelectorAll('.pr[data-dtype="prod"][data-group="'+group+'"]')];
}
function onPointerDown(e){
 const handle=e.target.closest('.handle');
 if(!handle)return;
 const row=handle.closest('.pr');
 if(!row)return;
 e.preventDefault();
 e.stopPropagation();
 drag.active=true;
 drag.type=row.dataset.dtype;
 drag.group=row.dataset.group||null;
 drag.id=row.dataset.id;
 drag.el=row;
 drag.startY=e.clientY;
 drag.lastY=e.clientY;
 row.classList.add('dragging');
 row.setPointerCapture?.(e.pointerId);
}
function onPointerMove(e){
 if(!drag.active)return;
 e.preventDefault();
 const dy=e.clientY-drag.lastY;
 drag.lastY=e.clientY;
 // auto-scroll near edges
 const edge=60;
 if(e.clientY<edge)window.scrollBy(0,-12);
 else if(e.clientY>window.innerHeight-edge)window.scrollBy(0,12);
 const els=getListEls(drag.type,drag.group);
 const myIdx=els.indexOf(drag.el);
 if(myIdx<0)return;
 // find which row is under the pointer
 let targetIdx=myIdx;
 for(let i=0;i<els.length;i++){
  if(i===myIdx)continue;
  const r=els[i].getBoundingClientRect();
  const mid=r.top+r.height/2;
  if(e.clientY<mid&&i<myIdx){targetIdx=i;break}
  if(e.clientY>mid&&i>myIdx)targetIdx=i;
 }
 if(targetIdx!==myIdx){
  const parent=drag.el.parentNode;
  if(targetIdx<myIdx)parent.insertBefore(drag.el,els[targetIdx]);
  else parent.insertBefore(drag.el,els[targetIdx].nextSibling);
 }
}
async function onPointerUp(e){
 if(!drag.active)return;
 drag.el.classList.remove('dragging');
 drag.el.releasePointerCapture?.(e.pointerId);
 const type=drag.type,group=drag.group;
 drag.active=false;
 // read new order from DOM and save positions
 const els=getListEls(type,group);
 const ids=els.map(el=>el.dataset.id);
 try{
  if(type==='cat'){
   const updates=ids.map((id,i)=>{const c=cats.find(x=>x.id===id);return {...c,position:i}});
   await Promise.all(updates.map(c=>saveCategory(c)));
   cats=await loadCategories();
   toast('Category order saved');
  }else{
   const updates=ids.map((id,i)=>{const p=list.find(x=>x.id===id);return {...p,position:i}});
   await Promise.all(updates.map(p=>saveProduct(p)));
   list=await loadProducts();
   toast('Product order saved');
  }
  render();
 }catch(err){toast('Could not save order: '+(err.code||err.message));render()}
}
document.addEventListener('pointerdown',onPointerDown,{passive:false});
document.addEventListener('pointermove',onPointerMove,{passive:false});
document.addEventListener('pointerup',onPointerUp);
document.addEventListener('pointercancel',onPointerUp);
// ---- site logo ----
window.saveSiteLogo=async()=>{
 if(!siteLogo)return toast('Please add a logo image first');
 try{await saveLogo(siteLogo);toast('Logo saved! It will show on the shop and home page.');render()}
 catch(e){toast('Could not save logo: '+(e.code||e.message))}
};
window.resetLogo=()=>{siteLogo=LOGO;render();toast('Reset to the original logo (click Save to keep)')};
window.rmLogo=()=>{siteLogo='';render()};

// ---- screens ----
const slot=(t,gi,ci,img,cls,label)=>{const k=t+'|'+gi+'|'+ci;return `<div class="slot ${cls} ${keyOf(act)===k?'act':''}" data-k="${k}" onclick="actv('${t}',${gi},${ci})" ondragover="event.preventDefault()" ondrop="dropP(event,'${t}',${gi},${ci})">${img?`<img src="${img}" alt="">`:`<span>${label}</span>`}</div>`};
function groupHtml(g,gi){
 const rd=gi<0,showStock=rd||!isDes();
 return `<div class="grp">${rd?'':`<label style="margin-top:0">Group name (what customers see, e.g. Outside, Inside, Color)</label><input type="text" id="gl${gi}" value="${esc(g.label)}" placeholder="e.g. Outside">`}
<label${rd?' style="margin-top:0"':''}>Tap colors to offer</label><div class="pal">${PALETTE.map((c,pi)=>`<button class="pc ${g.colors.some(x=>same(x,c))?'on':''}" style="background:${c.h}" title="${esc(c.name||c.n)}" aria-label="${esc(c.n)}" onclick="togColor(${gi},${pi})"></button>`).join('')}</div>
<label>Or add your own color</label><div class="cust"><input type="color" id="ch${gi}" value="#c8553d"><input type="text" id="cn${gi}" placeholder="Color name"><button class="btn alt sm" onclick="addCustom(${gi})">Add</button></div>
${g.colors.length?`<label>${showStock?'Stock and photo for each color. ':'Photo for each color. '}Tap Choose photo to pick one from your phone or computer${COARSE?'':' (or click a box and press Ctrl+V)'}.</label><div class="cards">${g.colors.map((c,ci)=>`<div class="cc">${slot('color',gi,ci,pf.photos[c.id],'sm2',PHL)}<div class="nm2"><i style="background:${c.h}"></i><input type="text" value="${esc(c.n)}" onchange="nameColor(${gi},${ci},this.value)" aria-label="Color name"></div>${showStock?`<div class="stkrow"><span>Stock</span><input type="number" class="stk" min="0" step="1" inputmode="numeric" value="${c.stock===''||c.stock==null?'':c.stock}" placeholder="0" oninput="setStock(${gi},${ci},this.value)" aria-label="Stock"></div>`:''}<div class="row2"><button class="pick" onclick="document.getElementById('kf${gi}_${ci}').click()">Choose photo</button>${pf.photos[c.id]?`<button onclick="rmPhoto(${gi},${ci})">Remove photo</button>`:''}<button onclick="rmColor(${gi},${ci})" aria-label="Remove color">Remove color</button></div><input type="file" accept="image/*" id="kf${gi}_${ci}" style="display:none" onchange="onFile(this,'color',${gi},${ci})"></div>`).join('')}</div>`:'<p class="hint">No colors chosen yet.</p>'}
${!rd&&!isDes()&&pf.groups.length>1?`<div class="acts"><button class="btn alt sm dng" onclick="rmGroup(${gi})">Remove this group</button></div>`:''}</div>`;
}
function productRow(p){
 const c=cats.find(x=>x.id===p.category),n=(p.options||[]).reduce((s,g)=>s+(g.colors||[]).length,0),sk=readyStock(p),skt=sk<=0?'Sold out':(sk===Infinity?'Stock not set':'Stock: '+sk);
 return `<div class="pr" data-dtype="prod" data-group="${esc(p.category||'__none')}" data-id="${esc(p.id)}">${HANDLE}<img src="${p.image}" alt=""><div class="t"><b>${esc(p.name)}</b><span>${esc(c?c.name:'No category (hidden)')} · ${peso(p.price)} · ${skt}${n?' · '+n+' color choices':''}${p.designer?' · Customizable':''}</span></div><button class="btn alt sm" onclick="editP('${esc(p.id)}')">Edit</button><button class="btn alt sm dng" onclick="delP('${esc(p.id)}')">Delete</button></div>`;
}

// ---- orders ----
const stockTotal=p=>{
 if(p.designer&&(p.readyColors||[]).length)return p.readyColors.reduce((s,c)=>s+(typeof c.stock==='number'?c.stock:0),0);
 if(!p.designer){const gs=colorGroups(p);if(gs.length)return Math.min(...gs.map(g=>g.colors.reduce((s,c)=>s+(typeof c.stock==='number'?c.stock:0),0)))}
 return p.stock};
async function deductStock(o){
 const touched=new Map();
 for(const it of o.items||[]){
  if(it.custom)continue;
  const p=list.find(x=>x.id===it.pid);if(!p)continue;
  let did=false;
  (it.variants||[]).filter(v=>v.id).forEach(v=>{const c=allColors(p).find(k=>k.id===v.id);if(c&&typeof c.stock==='number'){c.stock=Math.max(0,c.stock-it.q);did=true}});
  if(!did&&typeof p.stock==='number'&&!(p.readyColors||[]).length&&!colorGroups(p).length){p.stock=Math.max(0,p.stock-it.q);did=true}
  if(did){p.stock=stockTotal(p);p.soldOut=p.stock<=0;touched.set(p.id,p)}
 }
 for(const p of touched.values())await saveProduct(p);
 return touched.size;
}
window.reloadOrders=async()=>{try{orders=await loadOrders();ordersErr=''}catch(e){orders=[];ordersErr=e.code||e.message||'error'}render()};
window.confirmOrder=async id=>{const o=orders.find(x=>x.id===id);if(!o)return;
 if(!confirm('Confirm order #'+o.no+'? This lowers the stock of the items ordered.'))return;
 try{const n=o.stockDeducted?0:await deductStock(o);o.status='confirmed';o.stockDeducted=true;await saveOrder(o);toast('Order confirmed'+(n?' and stock updated':''))}
 catch(e){toast('Could not update: '+(e.code||e.message))}
 render()};
window.doneOrder=async id=>{const o=orders.find(x=>x.id===id);if(!o)return;try{o.status='done';await saveOrder(o);toast('Marked as done')}catch(e){toast('Could not update: '+(e.code||e.message))}render()};
window.delOrder=async id=>{const o=orders.find(x=>x.id===id);if(!o||!confirm('Delete order #'+o.no+'? This cannot be undone.'))return;
 try{await deleteOrder(id);orders=orders.filter(x=>x.id!==id);toast('Order deleted')}catch(e){toast('Could not delete: '+(e.code||e.message))}render()};
const ST={new:'New',confirmed:'Confirmed (stock updated)',done:'Done'};
function orderCard(o){
 const d=o.createdAt?new Date(o.createdAt).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'}):'';
 const lines=(o.items||[]).map(x=>`<div style="margin:4px 0">${esc(x.name)}${(x.variants||[]).length?' <span class="mut">('+x.variants.map(v=>esc(v.g)+': '+esc(v.n)).join(', ')+')</span>':''} &times; ${x.q} &middot; ${peso(x.price*x.q)}</div>`).join('');
 const acts=o.status==='new'?`<button class="btn sm" onclick="confirmOrder('${esc(o.id)}')">Confirm order</button>`:o.status==='confirmed'?`<button class="btn sm" onclick="doneOrder('${esc(o.id)}')">Mark as done</button>`:'';
 return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b>Order #${esc(o.no||o.id.slice(-6).toUpperCase())}</b><span class="mut" style="font-size:12px">${esc(d)}</span></div>
<div class="mut" style="margin:4px 0 8px">${esc(o.name||'')} &middot; ${esc(o.email||'')}</div>${lines}
<div style="margin-top:8px"><b>Total ${peso(o.total)}</b> <span class="mut">&middot; ${ST[o.status]||esc(o.status||'')}</span></div>
<div class="acts" style="margin-top:12px">${acts}<button class="btn alt sm dng" onclick="delOrder('${esc(o.id)}')">Delete</button></div></div>`;
}
function ordersView(){
 if(ordersErr)return `<div class="card"><h2>Orders</h2><p class="hint" style="margin-top:0">Orders could not be loaded (${esc(ordersErr)}). Add the Firestore rule for orders (I gave you the text), then press Refresh.</p><div class="acts"><button class="btn alt sm" onclick="reloadOrders()">Refresh</button></div></div>`;
 return `<div class="card"><h2>Orders (${orders.length})</h2><p class="hint" style="margin-top:0">New orders appear here when customers check out. Confirm an order to lower the stock of what was ordered. Customized bags are made to order, so they never change stock.</p><div class="acts"><button class="btn alt sm" onclick="reloadOrders()">Refresh</button></div></div>${orders.length?orders.map(orderCard).join(''):'<p class="mut">No orders yet.</p>'}`;
}
function siteView(){
 return `<div class="card"><h2>Shop logo</h2>
<p class="hint" style="margin-top:0">This picture appears at the top of the home page and the shop. Use a square image for best results.</p>
<label>Logo</label>${slot('logo',0,0,siteLogo,'big',PHL)}
<div class="acts" style="margin-top:8px"><button class="btn alt sm" onclick="document.getElementById('logo_file').click()">Choose logo from your device</button></div><div class="hint">On a computer you can also click the box and press Ctrl+V, or drop a file on it.</div>
<input type="file" accept="image/*" id="logo_file" style="display:none" onchange="onFile(this,'logo')">
${siteLogo?`<div style="margin-top:14px;display:flex;align-items:center;gap:12px"><img src="${siteLogo}" alt="Preview" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--bd)"><span class="mut" style="font:13px system-ui,sans-serif">Preview (how it looks in the header)</span></div>`:''}
<div class="acts">
<button class="btn" onclick="saveSiteLogo()">Save logo</button>
<button class="btn alt" onclick="resetLogo()">Use original logo</button>
</div></div>`;
}

function productsView(){
 ensureDes();
 const colorsUI=pf.useColors?`${pf.groups.map(groupHtml).join('')}<div class="acts"><button class="btn alt sm" onclick="addGroup()">Add another color group</button><button class="btn alt sm" onclick="presetBag()">Set up Outside + Inside (for bags)</button></div>`:'';
const stockBox=`<label>Stock (how many you have; it shows as Sold out at 0)</label><input type="number" id="f_st" min="0" step="1" inputmode="numeric" value="${esc(pf.stock)}" placeholder="e.g. 10">`;
 const hasC=pf.groups.some(g=>g.colors.length);
 const stockUI=isDes()
  ?`${pf.useReady&&pf.readyG.colors.length?'':stockBox}<label class="chk"><input type="checkbox" id="f_ur" ${pf.useReady?'checked':''} onchange="sync();render()"> Let customers choose colors for the ready-made bag</label>${pf.useReady?groupHtml(pf.readyG,-1):''}
<div class="sec">Customize colors (Outside + Inside)</div><p class="hint" style="margin-top:0">Customers pick from these when they tap Customize. Customized bags are made to order, so there is no stock count here.</p>${pf.groups.map((g,gi)=>groupHtml(g,gi)).join('')}`
  :`${pf.useColors&&hasC?'':stockBox}<label class="chk"><input type="checkbox" id="f_u" ${pf.useColors?'checked':''} onchange="sync();render()"> Let customers choose colors</label>${colorsUI}`;
  // group products by category, following category order
 const groups=[];
 for(const cat of cats){
  const items=list.filter(p=>p.category===cat.id);
  groups.push({id:cat.id,name:cat.name,items});
 }
 const orphans=list.filter(p=>!cats.some(c=>c.id===p.category));
 if(orphans.length)groups.push({id:'__none',name:'No category',items:orphans});

 const groupsHtml=groups.map(g=>{
  const open=openGroups.has(g.id);
  return `<div class="cg ${open?'open':''}" data-gid="${esc(g.id)}">
<div class="cg-h" onclick="toggleGroup('${esc(g.id)}')">
<svg class="arrow" viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4"/></svg>
<b>${esc(g.name)}</b>
<span class="cnt">${g.items.length} product${g.items.length===1?'':'s'}</span>
</div>
<div class="cg-body">${g.items.length?g.items.map(productRow).join(''):'<p class="mut" style="padding:8px 0">No products in this category.</p>'}</div>
</div>`;
 }).join('');

 return `<div class="card"><h2>${pf.id?'Edit product':'Add a product'}</h2>
<label>Main photo</label>${slot('p',0,0,pf.image,'big',PHL)}<div class="acts" style="margin-top:8px"><button class="btn alt sm" onclick="document.getElementById('pf_file').click()">Choose photo from your device</button></div><div class="hint">On a computer you can also click the box and press Ctrl+V, or drop a file on it.</div><input type="file" accept="image/*" id="pf_file" style="display:none" onchange="onFile(this,'p')">
<label>Name</label><input type="text" id="f_n" value="${esc(pf.name)}" placeholder="e.g. Bear keychain">
<label>Category</label><select id="f_c" onchange="sync();render()">${pf.category&&cats.some(c=>c.id===pf.category)?'':'<option value="">Choose a category</option>'}${cats.map(c=>`<option value="${esc(c.id)}" ${pf.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
<label>Price (pesos)</label><input type="number" id="f_p" min="0" step="1" inputmode="numeric" value="${esc(pf.price)}" placeholder="e.g. 120">
<label>Description and other details</label><textarea id="f_d" placeholder="Size, materials, care...">${esc(pf.description)}</textarea>
${stockUI}
<div class="acts"><button class="btn" id="sv" onclick="saveP()">${pf.id?'Save changes':'Add product'}</button>${pf.id?'<button class="btn alt" onclick="cancelP()">Cancel</button>':''}</div></div>
<div class="card"><h2>Your products (${list.length})</h2>
<p class="hint" style="margin-top:0;margin-bottom:12px">Tap a category to expand. Drag the ☰ handle to change order inside a category.</p>
${groupsHtml||'<p class="mut">No products yet.</p>'}</div>`;
}
function catsView(){
 return `<div class="card"><h2>${cf.id?'Edit category':'Add a category'}</h2>
<label>Picture</label>${slot('c',0,0,cf.image,'big',PHL)}<div class="acts" style="margin-top:8px"><button class="btn alt sm" onclick="document.getElementById('cf_file').click()">Choose photo from your device</button></div><div class="hint">On a computer you can also click the box and press Ctrl+V, or drop a file on it.</div><input type="file" accept="image/*" id="cf_file" style="display:none" onchange="onFile(this,'c')">
<label>Name</label><input type="text" id="c_n" value="${esc(cf.name)}" placeholder="e.g. Scrunchies">
<div class="acts"><button class="btn" id="cv" onclick="saveC()">${cf.id?'Save changes':'Add category'}</button>${cf.id?'<button class="btn alt" onclick="cancelC()">Cancel</button>':''}</div></div>
<div class="card"><h2>Your categories (${cats.length})</h2>
<p class="hint" style="margin-top:0;margin-bottom:12px">Drag the ☰ handle to change the order shown on the shop.</p>
${cats.map(c=>`<div class="pr" data-dtype="cat" data-id="${esc(c.id)}">${HANDLE}${c.image?`<img src="${c.image}" alt="">`:'<div class="ph"></div>'}<div class="t"><b>${esc(c.name)}</b><span>${list.filter(p=>p.category===c.id).length} products</span></div><button class="btn alt sm" onclick="editC('${esc(c.id)}')">Edit</button><button class="btn alt sm dng" onclick="delC('${esc(c.id)}')">Delete</button></div>`).join('')||'<p class="mut">No categories yet.</p>'}</div>`;
}
window.sync=sync;window.render=()=>render();
function render(){
 const top=right=>`<header><button class="back" onclick="location.href='shop.html'" aria-label="Back to shop">${BACK}</button><span class="ttl">Owner panel</span>${right||''}</header>`;
 if(!user){root.innerHTML=top()+`<div class="center"><p class="mut">This page is only for the shop owner.</p><button class="btn" onclick="login()">Sign in with Google</button></div>`;return}
 if(!isAdmin(user)){root.innerHTML=top('<button class="lnk" onclick="out()">Sign out</button>')+`<div class="center"><h2>Access denied</h2><p class="mut">This page is only for the shop owner. You are signed in as ${esc(user.email)}.</p></div>`;return}
 if(loading){root.innerHTML=top('<button class="lnk" onclick="out()">Sign out</button>')+'<main><p class="mut">Loading your shop...</p></main>';return}
 root.innerHTML=top('<button class="lnk" onclick="out()">Sign out</button>')+`<main style="padding-bottom:40px"><div class="tabs"><button class="${tab==='products'?'on':''}" onclick="setTab('products')">Products</button><button class="${tab==='cats'?'on':''}" onclick="setTab('cats')">Categories</button><button class="${tab==='orders'?'on':''}" onclick="setTab('orders')">Orders${orders.filter(o=>o.status==='new').length?' ('+orders.filter(o=>o.status==='new').length+')':''}</button><button class="${tab==='site'?'on':''}" onclick="setTab('site')">Site</button></div>${tab==='products'?productsView():tab==='cats'?catsView():tab==='orders'?ordersView():siteView()}</main>`;
}
</script></body></html>
