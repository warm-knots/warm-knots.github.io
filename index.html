<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warm Knots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<style>
:root{--bg:#fbf6ef;--fg:#3a2e2a;--card:#fff;--mut:#8a7a70;--acc:#c8553d;--bd:#eadfd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a18;--fg:#f3e9df;--card:#2b2421;--mut:#b5a499;--bd:#3d322d}}
:root[data-theme="dark"]{--bg:#1f1a18;--fg:#f3e9df;--card:#2b2421;--mut:#b5a499;--bd:#3d322d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
header{display:flex;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd)}
header b{flex:1;white-space:nowrap}
.brand{font-family:'Pacifico','Brush Script MT',cursive;font-weight:400;color:var(--acc)}
header .brand{font-size:28px}
.sub{color:var(--mut);font-size:17px;max-width:540px;margin:6px auto 0}
.user{display:flex;align-items:center;gap:8px;font-family:system-ui,sans-serif;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;object-fit:cover;font-weight:600}
.lnk{color:var(--fg);background:none;border:0;cursor:pointer;padding:0;font:14px system-ui,sans-serif;text-decoration:underline}
.hero{max-width:980px;margin:0 auto;text-align:center;padding:64px 20px}
.hero h1{font-size:clamp(30px,7vw,52px);margin:0 0 6px}
.signin{background:var(--card);border:1px solid var(--bd);border-radius:16px;max-width:380px;margin:26px auto 0;padding:20px;font-family:system-ui,sans-serif}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:999px;padding:10px 20px;font:500 15px system-ui,sans-serif;cursor:pointer}
.gbtn svg{width:18px;height:18px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:10px 22px;font-size:15px;cursor:pointer;font-family:system-ui,sans-serif}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.mut{color:var(--mut);font:13px system-ui,sans-serif}
#demo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:6;padding:20px}
#demo>div{background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%;font-family:system-ui,sans-serif;text-align:left}
#demo input{width:100%;box-sizing:border-box;padding:10px;margin:10px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font:14px system-ui,sans-serif;display:none;max-width:90%}
</style></head>
<body>
<div id="root"></div>
<div id="demo"><div><b>Preview sign-in</b><p class="mut">Google sign-in isn't connected in this preview. Enter any Gmail address to see how the page looks after signing in.</p><input id="dm" type="email" placeholder="you@gmail.com"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn alt" onclick="demoClose()">Cancel</button><button class="btn" onclick="demoGo()">Continue</button></div></div></div>
<div id="toast"></div>
<script>
/* Paste your Google OAuth Client ID between the quotes to turn on real Google sign-in */
const CONFIG={GOOGLE_CLIENT_ID:''};

let user=null,tc=null;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}

function signIn(u){user=u;ls.set('wk_user',JSON.stringify(u));render()}
function signOut(){user=null;ls.del('wk_user');render()}

/* Google sign-in: opens Google's account chooser (accounts already signed in on this browser).
   If none are signed in, Google shows its own login page in the same window. */
function loadGoogle(){
 if(!CONFIG.GOOGLE_CLIENT_ID||document.getElementById('gis'))return;
 const s=document.createElement('script');s.id='gis';s.src='https://accounts.google.com/gsi/client';s.async=true;
 s.onload=()=>{tc=google.accounts.oauth2.initTokenClient({client_id:CONFIG.GOOGLE_CLIENT_ID,scope:'openid email profile',callback:onToken,error_callback:()=>toast('Sign-in was cancelled.')})};
 document.head.appendChild(s);
}
function googleSignIn(){
 if(!CONFIG.GOOGLE_CLIENT_ID)return demoOpen();
 if(!tc)return toast('Google is still loading. Please try again in a moment.');
 tc.requestAccessToken({prompt:'select_account'});
}
async function onToken(r){
 if(!r||r.error)return toast('Sign-in failed. Please try again.');
 try{const res=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+r.access_token}});
  const p=await res.json();signIn({email:p.email,name:p.name||p.email,pic:p.picture||''})}
 catch(e){toast('Could not complete sign-in.')}
}

function demoOpen(){document.getElementById('demo').style.display='flex';document.getElementById('dm').focus()}
function demoClose(){document.getElementById('demo').style.display='none'}
function demoGo(){const e=document.getElementById('dm').value.trim().toLowerCase();
 if(!/^[^\s@]+@gmail\.com$/.test(e))return toast('Please enter a valid Gmail address');
 demoClose();signIn({email:e,name:e.split('@')[0],pic:''})}

const G='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';

function render(){
 const first=user?esc(user.name.split(' ')[0]):'';
 document.getElementById('root').innerHTML=`
<header><b class="brand">Warm Knots</b>${user?`<span class="user">${user.pic?`<img class="av" src="${esc(user.pic)}" alt="" referrerpolicy="no-referrer">`:`<span class="av">${esc(user.name[0].toUpperCase())}</span>`}${first}<button class="lnk" onclick="signOut()">Sign out</button></span>`:''}</header>
<section class="hero">
 <h1>${user?`Welcome back, ${first}!`:'Welcome to <span class="brand">Warm Knots</span>'}</h1>
 <p class="sub">Cozy, handmade crochet pieces made with care.</p>
 ${user?'':`<div class="signin"><div style="margin-bottom:12px"><b>Sign in</b></div><button class="gbtn" onclick="googleSignIn()">${G}Sign in with Google</button></div>`}
</section>`;
}
(function init(){try{const u=JSON.parse(ls.get('wk_user')||'null');if(u&&u.email)user=u}catch(e){}render();loadGoogle()})();
</script></body></html>
