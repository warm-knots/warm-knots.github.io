<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warm Knots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.hero{max-width:980px;margin:0 auto;text-align:center;padding:64px 20px}
.hero h1{font-size:clamp(28px,7vw,52px);margin:0 0 6px}.hero h1 .brand{font-size:inherit;flex:none}
.signin{background:var(--card);border:1px solid var(--bd);border-radius:16px;max-width:380px;margin:26px auto 0;padding:20px;font-family:system-ui,sans-serif}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:999px;padding:10px 20px;font:500 15px system-ui,sans-serif;cursor:pointer}
.gbtn svg{width:18px;height:18px}
</style></head>
<body><div id="root"></div>
<script type="module">
import {onUser,signIn,toast,loadLogo} from './app.js';
const G='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';
async function go(){
 try{await signIn()}
 catch(e){const c=e.code||'';if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
  toast(c==='auth/unauthorized-domain'?'This website address is not authorized in Firebase yet.':c==='auth/popup-blocked'?'Please allow pop-ups for this site and try again.':'Sign-in failed. Please try again.')}
}
async function render(){
 const logo=await loadLogo();
 document.getElementById('root').innerHTML=`<header><img class="logo" src="${logo}" alt="Warm Knots logo"><span class="brand">Warm Knots</span></header>
<section class="hero"><h1>Welcome to <span class="brand">Warm Knots</span></h1><p class="sub" style="margin:6px auto 0;max-width:540px">Cozy, handmade crochet pieces made with care.</p>
<div class="signin"><div style="margin-bottom:12px"><b>Sign in</b></div><button class="gbtn" id="gb">${G}Sign in with Google</button></div></section>
<footer><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></footer>`;
 document.getElementById('gb').onclick=go;
}
onUser(u=>{if(u)location.replace('shop.html');else render()});
</script></body></html>
