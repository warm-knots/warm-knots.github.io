<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopping Cart | Warm Knots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<link rel="stylesheet" href="style.css">
<style>
header .edit{background:none;border:0;color:var(--fg);font:15px system-ui,sans-serif;cursor:pointer}
.it{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.it input[type=checkbox],.all input{width:20px;height:20px;accent-color:var(--acc);margin:28px 0 0;flex:none}
.th{width:84px;height:84px;border-radius:10px;background:#f3ebdf;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}.th svg{height:86%}.th img{width:100%;height:100%;object-fit:contain}
.inf{flex:1;min-width:0;font-family:system-ui,sans-serif}.nmx{font:600 15px Georgia,serif}
.var{font-size:12px;color:var(--mut);margin:4px 0 8px;min-height:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid #cdbfae;margin-right:3px;vertical-align:middle}
.pq{display:flex;justify-content:space-between;align-items:center}.pr{color:var(--acc);font-weight:600;font-size:16px}
.qt{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.qt button{background:#fff;border:0;width:30px;height:28px;font-size:18px;cursor:pointer;color:var(--fg)}.qt span{min-width:30px;text-align:center;font-size:14px}
.dl{background:none;border:1px solid var(--acc);color:var(--acc);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:13px}
.all{display:flex;align-items:center;gap:8px;font-size:15px}.all input{margin:0}
.tot{flex:1;text-align:right;font-size:13px;color:var(--mut)}.tot b{font-size:18px;color:var(--acc)}
@media(max-width:520px){.it{padding:10px}.th{width:72px;height:72px}}
</style></head>
<body class="hasbar"><div id="root"></div>
<script type="module">
import {gate,getCart,saveCart,loadProducts,loadColorPhotos,esc,peso,shade as sh,BACK,HOME,toast,readyStock,allColors,colorStock} from './app.js';
const FB_URL=''; /* paste your Facebook Page link between the quotes so Check Out opens your page */
let user=null,items=[],imgs={},cph={},edit=false,prods={};
const limitOf=x=>{const p=prods[x.pid];if(!p)return Infinity;if(p.designer&&!x.ready)return Infinity;
 const vs=vars(x).filter(v=>v.id);if(!vs.length)return readyStock(p);
 let m=Infinity;vs.forEach(v=>{const c=allColors(p).find(k=>k.id===v.id);if(c)m=Math.min(m,colorStock(c))});return m};
const find=id=>items.find(x=>x.id===id);
const save=()=>saveCart(user.uid,items).catch(()=>toast('Could not save your cart. Please check your connection.'));
const vars=x=>x.variants||(x.o?[{g:'Outside',n:x.o.n,h:x.o.h},{g:'Inside',n:x.i.n,h:x.i.h}]:[]);
const thumb=x=>{const v0=vars(x)[0],ph=v0&&v0.id&&cph[x.pid]&&cph[x.pid][v0.id];if(ph)return `<img src="${ph}" alt="">`;if(x.pid==='tote'&&!x.ready){const h=(vars(x)[0]||{h:'#f2e6d0'}).h;return `<svg viewBox="0 0 200 220" aria-hidden="true"><path d="M62 84C62 14 138 14 138 84" fill="none" stroke="${sh(h,.22)}" stroke-width="9" stroke-linecap="round"/><path d="M28 80H172L162 204Q161 210 155 210H45Q39 210 38 204Z" fill="${h}" stroke="${sh(h,.2)}" stroke-width="2"/><path d="M28 80H172" stroke="${sh(h,.3)}" stroke-width="5" stroke-linecap="round"/></svg>`}return imgs[x.pid]?`<img src="${imgs[x.pid]}" alt="">`:''};
window.tog=id=>{const f=find(id);f.sel=!f.sel;save();render()};
window.allTog=()=>{const a=items.every(x=>x.sel);items.forEach(x=>x.sel=!a);save();render()};
window.qty=(id,d)=>{const f=find(id);if(d>0){const m=limitOf(f);if(f.q+d>m){toast(m<=0?'Sorry, this is sold out':'Only '+m+' in stock');return}}f.q=Math.max(1,f.q+d);save();render()};
window.del=id=>{items=items.filter(x=>x.id!==id);save();render()};
window.delSel=()=>{items=items.filter(x=>!x.sel);save();render()};
window.toggleEdit=()=>{edit=!edit;render()};
window.chk=()=>{const s=items.filter(x=>x.sel);if(!s.length)return;
 const lines=s.map((x,i)=>`${i+1}. ${x.name}${vars(x).length?` (${vars(x).map(v=>v.g+': '+v.n).join(', ')})`:''} x${x.q} - ${peso(x.price*x.q)}`);
 const msg=`Hi Warm Knots! I'd like to order:\n${lines.join('\n')}\nTotal: ${peso(s.reduce((t,x)=>t+x.price*x.q,0))}\nName: ${user.name} (${user.email})`;
 try{navigator.clipboard.writeText(msg)}catch(e){}
 if(FB_URL)window.open(FB_URL,'_blank');
 toast(FB_URL?'Order details copied. Paste them in our Facebook chat!':'Order details copied. Send them to our Facebook Page to place your order.')};
const row=x=>`<div class="it"><input type="checkbox" ${x.sel?'checked':''} onchange="tog('${x.id}')" aria-label="Select item"><div class="th">${thumb(x)}</div><div class="inf"><div class="nmx">${esc(x.name)}</div><div class="var">${vars(x).map(v=>`<i class="dot" style="background:${v.h}"></i>${esc(v.g)}: ${esc(v.n)}`).join(' &middot; ')}</div>${limitOf(x)<x.q?`<div class="var" style="color:#b3261e">${limitOf(x)<=0?'Sold out':'Only '+limitOf(x)+' left'}</div>`:''}<div class="pq"><span class="pr">${peso(x.price)}</span>${edit?`<button class="dl" onclick="del('${x.id}')">Delete</button>`:`<span class="qt"><button onclick="qty('${x.id}',-1)" aria-label="Less">&minus;</button><span>${x.q}</span><button onclick="qty('${x.id}',1)" aria-label="More">+</button></span>`}</div></div></div>`;
function render(){
 const sel=items.filter(x=>x.sel),total=sel.reduce((s,x)=>s+x.price*x.q,0),n=items.reduce((s,x)=>s+x.q,0),selN=sel.reduce((s,x)=>s+x.q,0),all=items.length&&items.every(x=>x.sel);
 document.getElementById('root').innerHTML=`<header><button class="back" onclick="history.length>1?history.back():location.href='shop.html'" aria-label="Back">${BACK}</button>${items.length?`<button class="back" onclick="location.href='shop.html'" aria-label="Home">${HOME}</button>`:''}<span class="ttl">Shopping Cart${n?` (${n})`:''}</span>${items.length?`<button class="edit" onclick="toggleEdit()">${edit?'Done':'Edit'}</button>`:''}</header>
<main>${items.length?items.map(row).join(''):`<div class="empty"><h2>Your cart is empty</h2><p>Items you add will show up here.</p><button class="btn" onclick="location.href='shop.html'">Start shopping</button></div>`}</main>
${items.length?`<div class="bar"><label class="all"><input type="checkbox" ${all?'checked':''} onchange="allTog()"> All</label><div class="tot">Total <b>${peso(total)}</b></div><button class="btn" ${sel.length?'':'disabled'} onclick="${edit?'delSel()':'chk()'}">${edit?`Delete (${sel.length})`:`Check Out (${selN})`}</button></div>`:''}`}
gate(async u=>{
 user=u;document.getElementById('root').innerHTML='<main><p class="mut">Loading your cart...</p></main>';
 try{items=await getCart(u.uid)}catch(e){items=[]}
 render();
 try{(await loadProducts()).forEach(p=>{imgs[p.id]=p.image;prods[p.id]=p});render()}catch(e){}
 try{const pids=[...new Set(items.filter(x=>vars(x).some(v=>v.id)).map(x=>x.pid))];await Promise.all(pids.map(async pid=>{cph[pid]=await loadColorPhotos(pid)}));render()}catch(e){}
});
</script></body></html>
