<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reversible Tote Bag | Warm Knots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.wrap{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:720px){.wrap{grid-template-columns:1fr 1fr;align-items:start}}
#pv{background:#f3ebdf;border-radius:16px;height:clamp(230px,60vw,330px);display:flex;align-items:center;justify-content:center;border:1px solid var(--bd)}
#pv svg{height:86%;width:auto}
.opts{font-family:system-ui,sans-serif}.seg{display:flex;margin-top:12px}
.sg{flex:1;border:1px solid var(--bd);padding:9px 0;font:15px system-ui,sans-serif;cursor:pointer;background:#fff;color:var(--fg)}
.sg:first-child{border-radius:10px 0 0 10px}.sg:last-child{border-radius:0 10px 10px 0}.sg.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.opts h3{font-size:15px;margin:18px 0 4px}.opts .mut{margin:0 0 8px}
.sw{width:38px;height:38px;border-radius:50%;border:1px solid #cdbfae;padding:0;margin:0 8px 8px 0;cursor:pointer}.sw.on{outline:3px solid var(--acc);outline-offset:2px}
.sum{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:18px;font-size:15px}
.bar .pp{flex:1;font-size:13px;color:var(--mut)}.bar .pp b{display:block;font-size:20px;color:var(--fg)}
</style></head>
<body class="hasbar"><div id="root"></div>
<script type="module">
import {gate,getProduct,getCart,saveCart,setBadge,cartTotalQty,cartBtn,initBadge,shade as sh,peso,BACK,toast,DEFAULT_TOTE_PRICE} from './app.js';
/* Colors people can choose from. Edit names and hex codes here to match the yarn and fabric you really have. */
const COLORS=[{n:'Cream',h:'#f2e6d0'},{n:'Sage',h:'#9db39a'},{n:'Dusty rose',h:'#d9a0a0'},{n:'Navy',h:'#2b3a5c'},{n:'Mustard',h:'#d9a53b'},{n:'Charcoal',h:'#444444'}];
let PRICE=DEFAULT_TOTE_PRICE,user=null;
const st={o:1,i:3,v:'out'};
function bag(){const o=st.v==='out',b=COLORS[o?st.o:st.i].h,s=sh(b,.2),body='M28 80H172L162 204Q161 210 155 210H45Q39 210 38 204Z';
 return `<svg viewBox="0 0 200 220" role="img" aria-label="${o?'Crochet outside':'Waterproof inside'} of the tote bag"><defs><pattern id="pp" width="10" height="8" patternUnits="userSpaceOnUse"><rect width="10" height="8" fill="${b}"/><path d="M1 1L5 7L9 1" fill="none" stroke="${s}" stroke-width="1.3"/></pattern></defs>
<path d="M62 84C62 14 138 14 138 84" fill="none" stroke="${sh(b,.22)}" stroke-width="9" stroke-linecap="round"/><path d="${body}" fill="${o?'url(#pp)':b}"/>
${o?'':`<path d="M28 80H100L60 210H45Q39 210 38 204Z" fill="#fff" opacity=".22"/><rect x="72" y="150" width="56" height="20" rx="4" fill="${sh(b,.25)}" opacity=".5"/><text x="100" y="164" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#fff">waterproof</text>`}
<path d="M28 80H172" stroke="${sh(b,.3)}" stroke-width="5" stroke-linecap="round"/></svg>`}
const sws=k=>COLORS.map((c,i)=>`<button class="sw ${st[k]===i?'on':''}" style="background:${c.h}" aria-label="${c.n}" onclick="pick('${k}',${i})"></button>`).join('');
window.pick=(k,i)=>{st[k]=i;st.v=k==='o'?'out':'in';render()};
window.setView=v=>{st.v=v;render()};
window.addCart=async()=>{
 const o=COLORS[st.o],i=COLORS[st.i],id='tote-'+st.o+'-'+st.i;
 try{const c=await getCart(user.uid),f=c.find(x=>x.id===id);
  f?f.q++:c.push({id,pid:'tote',name:'Reversible Tote Bag',o:{n:o.n,h:o.h},i:{n:i.n,h:i.h},price:PRICE,q:1,sel:true});
  await saveCart(user.uid,c);setBadge(cartTotalQty(c));toast('Added to your cart')}
 catch(e){toast('Could not add to cart. Please try again.')}
};
function render(){
 document.getElementById('root').innerHTML=`<header><button class="back" onclick="location.href='category.html?c=bags'" aria-label="Back to bags">${BACK}</button><span class="ttl">Reversible Tote Bag</span>${cartBtn()}</header>
<main><div class="wrap"><div><div id="pv">${bag()}</div><div class="seg"><button class="sg ${st.v==='out'?'on':''}" onclick="setView('out')">Outside</button><button class="sg ${st.v==='in'?'on':''}" onclick="setView('in')">Inside</button></div></div>
<div class="opts"><h3>Outside color</h3><p class="mut">The crochet side: ${COLORS[st.o].n}</p>${sws('o')}<h3>Inside color</h3><p class="mut">The waterproof side: ${COLORS[st.i].n}</p>${sws('i')}
<div class="sum"><b>Your design</b><br>${COLORS[st.o].n} crochet outside, ${COLORS[st.i].n} waterproof inside</div></div></div></main>
<div class="bar"><div class="pp">Price<b>${peso(PRICE)}</b></div><button class="btn" onclick="addCart()">Add to cart</button></div>`}
gate(async u=>{user=u;try{const t=await getProduct('tote');if(t&&t.price)PRICE=Number(t.price)}catch(e){}render();initBadge(u.uid)});
</script></body></html>
