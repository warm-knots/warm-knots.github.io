<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop | Warm Knots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body><div id="root"></div>
<script type="module">
import {gate,loadProducts,cartBtn,initBadge,esc,peso,BACK,CATS,toast} from './app.js';
const q=new URLSearchParams(location.search).get('c'),cat=CATS[q]?q:'bags';
window.open_=(id,designer)=>location.href=designer?'tote.html':'product.html?id='+encodeURIComponent(id);
gate(async user=>{
 const head=`<header><button class="back" onclick="location.href='shop.html'" aria-label="Back to categories">${BACK}</button><span class="ttl">${CATS[cat]}</span>${cartBtn()}</header>`;
 document.getElementById('root').innerHTML=head+'<main><p class="mut">Loading...</p></main>';
 initBadge(user.uid);
 let ps=[];
 try{ps=(await loadProducts()).filter(p=>p.category===cat)}catch(e){document.querySelector('main').innerHTML='<div class="empty"><h2>Could not load products</h2><p>Please check your connection and try again.</p></div>';return}
 document.querySelector('main').innerHTML=ps.length?`<div class="grid">${ps.map(p=>`<button class="cat" onclick="open_('${esc(p.id)}',${!!p.designer})"><img class="pic" src="${p.image}" alt="${esc(p.name)}">${p.soldOut?'<span class="so">Sold out</span>':''}<div class="cap"><b>${esc(p.name)}</b>${!p.designer&&p.price?`<span>${peso(p.price)}</span>`:''}</div></button>`).join('')}</div>`:`<div class="empty"><h2>New ${CATS[cat].toLowerCase()} are on the way</h2><p>We're stitching away. Check back soon.</p></div>`;
});
</script></body></html>
