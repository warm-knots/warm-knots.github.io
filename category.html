<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop | Warm Knots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<style>
:root{color-scheme:only light;--bg:#fbf6ef;--fg:#3a2e2a;--card:#fff;--mut:#8a7a70;--acc:#c8553d;--bd:#eadfd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}
.back{background:none;border:0;color:var(--fg);cursor:pointer;padding:4px;display:flex}
.ttl{font-family:'Pacifico','Brush Script MT',cursive;color:var(--acc);font-size:clamp(20px,5.5vw,26px);white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:22px 16px 40px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font:14px system-ui,sans-serif;display:none;max-width:90%}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.cat{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--fg);font:inherit}
.cat .pic{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;border:1px solid var(--bd);display:block;transition:transform .15s}
.cat:hover .pic,.cat:focus-visible .pic{transform:translateY(-3px)}
.cat .nm{margin-top:8px;font-size:16px}.cat .pr{font:13px system-ui,sans-serif;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:50px 10px}.empty h2{color:var(--fg);font-size:20px;margin:0 0 6px}
@media(max-width:520px){main{padding:16px 12px 30px}.grid{gap:12px}.cat .nm{font-size:14px}}
</style></head>

function open_(id){const p=loadProducts().find(x=>x.id===id);if(p.page)nav(p.page);else toast('Product details are coming soon')}
function render(){
 if(LIVE&&!user)return;
 const ps=loadProducts().filter(p=>p.cat===cat);
 document.getElementById('root').innerHTML=`<header><button class="back" onclick="nav('shop.html')" aria-label="Back to categories">${BACK}</button><span class="ttl">${CATS[cat]}</span></header>
<main>${ps.length?`<div class="grid">${ps.map(p=>`<button class="cat" onclick="open_('${p.id}')"><img class="pic" src="${p.img}" alt="${esc(p.name)}"><div class="nm">${esc(p.name)}</div>${p.price?`<div class="pr">${esc(p.price)}</div>`:''}</button>`).join('')}</div>`:`<div class="empty"><h2>New ${CATS[cat].toLowerCase()} are on the way</h2><p>We're stitching away. Check back soon.</p></div>`}</main>`;
}
render();
</script></body></html>
